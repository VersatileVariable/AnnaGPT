# fly.toml app configuration file generated for annagpt on 2026-11-03T20:20:44-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'annagpt'
primary_region = 'lhr'

[build]
[env]
  DATA_FILE = '/data/conversations.json'
  NODE_ENV = 'production'
  PORT = '3000'

[[mounts]]
  source = 'annagpt_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
