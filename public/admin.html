<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>AnnaGPT Inbox</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <form id="login" class="login" hidden>
      <h2>AnnaGPT Inbox</h2>
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" required />
      <button type="submit">Sign in</button>
      <p id="login-error" class="error"></p>
    </form>

    <div id="app" class="app" hidden>
      <aside class="sidebar">
        <div class="brand">Inbox</div>
        <div id="list"></div>
        <div class="sidebar-spacer"></div>
        <button id="logout" class="sidebar-btn">Sign out</button>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <div id="title">Select a conversation</div>
            <div id="detail" class="detail"></div>
          </div>
          <span class="topbar-right">
            <button id="block" class="topbar-btn" hidden>Block IP</button>
            <span id="status" class="status">Connecting…</span>
          </span>
        </header>

        <div id="messages" class="messages">
          <div id="thread" class="thread"></div>
        </div>

        <form id="composer" class="composer" hidden>
          <textarea id="input" rows="1" placeholder="Reply as AnnaGPT" maxlength="2000"></textarea>
          <button type="submit" aria-label="Send">↑</button>
        </form>
      </main>
    </div>
    <script type="module" src="/admin.js"></script>
  </body>
</html>
